# ============================================================================
#  CI/CD de catalog · GitHub Actions → Amazon ECR → EC2 privada (AWS)
# ----------------------------------------------------------------------------
#  pull_request a main : compila, corre los tests y construye la imagen (sin publicar).
#  push a main         : lo mismo + publica la imagen en ECR y la despliega en la EC2
#                        andesstay-ep3-apps por AWS Systems Manager (sin SSH).
#
#  Secretos del repositorio (credenciales TEMPORALES del AWS Academy Learner Lab;
#  vencen con la sesión del lab y se renuevan con infra/aws/ep3/github-secretos.sh):
#    AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY · AWS_SESSION_TOKEN
#  Arquitectura y pasos manuales equivalentes: infra/aws/ep3/GUIA-ESTUDIO-EP3.md
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Dos despliegues del mismo servicio nunca corren a la vez; el segundo espera.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  SERVICE: catalog                    # servicio en infra/aws/ep3/hosts/apps/compose.yml
  ECR_REPOSITORY: andesstay/catalog
  DEPLOY_HOST: apps                   # EC2 con tag Name=andesstay-ep3-apps
  SMOKE_URL: https://kxsf0h77o2.execute-api.us-west-2.amazonaws.com/actuator/health

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests (mvn verify)
        run: ./mvnw -B -ntp verify

  image:
    name: Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # En un PR solo se comprueba que el Dockerfile construye; no se publica nada.
      - name: Construir (PR, sin publicar)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.ECR_REPOSITORY }}:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Credenciales de AWS (Learner Lab)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Dos tags: el commit (trazabilidad) y ep3 (el que usa el compose de la EC2).
      - name: Construir y publicar en ECR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:ep3
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en AWS
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales de AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # La EC2 no tiene IP pública ni SSH: el comando viaja por Systems Manager.
      # compose baja la imagen nueva de ECR y recrea SOLO este servicio (--no-deps),
      # esperando a que su health check quede healthy (--wait).
      - name: Actualizar el contenedor por SSM
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=andesstay-ep3-$DEPLOY_HOST" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$ID" ] || [ "$ID" = None ]; then
            echo "::error::La EC2 andesstay-ep3-$DEPLOY_HOST no está encendida (¿lab apagado?)"; exit 1
          fi
          REMOTE="set -e; export HOME=/root; cd /opt/andesstay/$DEPLOY_HOST; docker compose pull -q $SERVICE; docker compose up -d --no-deps --wait --wait-timeout 300 $SERVICE; docker compose ps $SERVICE"
          PARAMS=$(jq -cn --arg c "$REMOTE" '{commands: [$c], executionTimeout: ["600"]}')
          CID=$(aws ssm send-command --instance-ids "$ID" --document-name AWS-RunShellScript \
            --comment "CI/CD $GITHUB_REPOSITORY ${GITHUB_SHA::7}" --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "Comando SSM $CID en $ID"
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$ID" --query StandardErrorContent --output text >&2 || true
          [ "$STATUS" = Success ] || { echo "::error::El despliegue terminó en estado $STATUS"; exit 1; }

      # Prueba de humo desde internet, por API Gateway.
      - name: Prueba de humo
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SMOKE_URL" || true)
            echo "intento $i: $SMOKE_URL -> $code"
            [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::$SMOKE_URL no respondió 200"; exit 1
