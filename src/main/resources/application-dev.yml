# Perfil dev: H2 en memoria + datos semilla (DevDataSeeder). No requiere wallet ni red.
spring:
  datasource:
    url: jdbc:h2:mem:andesstay;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    cl.andesstay: DEBUG
