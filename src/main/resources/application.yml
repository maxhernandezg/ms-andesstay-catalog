# Configuracion comun del microservicio de catalogo (puerto 8082).
# Perfil activo por defecto: dev, para que el proyecto arranque recien clonado.
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-andesstay-catalog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          # Issuer de Azure AD (Entra ID). Se resuelve de forma perezosa: ver LazyJwtDecoder.
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:6f522bef-27e2-4548-89e6-c1717b61ae20}/v2.0

# Parametros propios de validacion del token (los consume AzureAdProperties).
andesstay:
  security:
    issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:6f522bef-27e2-4548-89e6-c1717b61ae20}/v2.0
    api-client-id: ${AZURE_API_CLIENT_ID:7d348e57-2f83-4648-baf0-588cbacccc3c}
    required-scope: access_as_user

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ms-andesstay-catalog
    description: Catalogo de unidades y disponibilidad de AndesStay
    port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cl.andesstay: INFO
    org.springframework.security: INFO
